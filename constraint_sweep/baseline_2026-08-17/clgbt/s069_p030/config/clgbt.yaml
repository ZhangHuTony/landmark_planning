# Sweep copy of config/clgbt.yaml -- see the drift note in config/mc/main.yaml.

# Parameters used only by the `clgbt` baseline — a sampling-based joint-tree
# search, ported from the algorithm in CL_GBT-master (a C++/OMPL "Cooperative
# Localization - Guided Belief Tree" planner: forward-propagating RRT over a
# CENTRALIZED multi-robot belief state, see CLguidedRRT.cpp). Merged with
# config/main.yaml at load time. Every key here is DEFAULTED in
# planners/clgbt.jl, so this file is documentation and tuning, not a
# requirement -- the planner runs against a config folder that lacks it.
#
# What is and is not ported, and why: see the header of planners/clgbt.jl.
# Short version — the TREE-GROWTH STRATEGY is ported (joint-state tree,
# nearest-neighbor steering, goal-biased and besties-biased sampling, one
# constant control per extension); the original's own Sigma/Lambda belief
# propagation and linear Cprop/Ccl measurement model are NOT — this baseline
# uses the SAME landmark/comm covariance model (src/covariance.jl) every other
# planner in this repo uses, so the comparison isolates "sampling-based tree
# growth" vs "combinatorial joint A*" under identical uncertainty semantics,
# not a different physics.
#
# The tree lives in CONTINUOUS R², as the original's does. It used to sample hex
# graph node indices and steer along graph edges, which handed it the joint A*'s
# own discretization and so confounded the single variable this baseline exists
# to isolate. The hex graph is still built (every other planner needs it) but
# clgbt now reads only two things off it: the corridor extents it samples in, so
# both arms search the same region, and the goal point.

# Search budget: cap on RRT iterations (one joint-tree sample-and-extend
# attempt each, successful or not). Nearest-neighbor here is a LINEAR SCAN
# over existing tree nodes (no KD-tree/GNAT, matching this baseline's spirit
# of a small, reviewable port rather than reproducing the original's
# NearestNeighborsKD infrastructure) — cost is O(iterations^2), so this is
# deliberately much smaller than astar_iteration_limit.
#
# SET FOR COMPUTE PARITY WITH hexspline_cl, not for count parity. An A* expansion
# and an RRT iteration are not the same unit of work — measured on this machine,
# an expansion costs 521.7us and an iteration 38-395us — so matching the two
# COUNTS would match neither work nor time. At the old 3000 the two budgets were:
#
#   hexspline_cl  1,600,000 expansions x 521.7us  = ~835 s
#   clgbt             3,000 iterations x  43.4us  = ~0.13 s     (a ~6400x gap)
#
# Cost is quadratic in the cap because nearest-neighbour is a LINEAR SCAN over the
# tree (no KD-tree/GNAT — this baseline stays a small reviewable port rather than
# reproducing the original's NearestNeighborsKD infrastructure). Fitting t = c*cap^2
# on a behind_wall run that reaches the cap (30,000 iters -> 23,441 nodes -> 12.07 s,
# c = 1.34e-8):
#
#   cap          est time   est tree   retained mem
#   100,000        134 s       78k        0.05 GB
#   250,000        838 s      195k        0.12 GB   <- matches the ~835 s above
#   1,600,000      9.5 h     1,250k       0.82 GB   <- count parity, not affordable
#
# So 250,000 buys clgbt the same SECONDS hexspline_cl gets. Memory is not the
# constraint (656 B/node retained); the linear scan is. Count parity would need a
# sub-quadratic nearest-neighbour index first.
#
# THIS SWEEP COPY: astar_iteration_limit is 1,000,000 here (config/mc/hexspline_cl.yaml),
# so hexspline_cl's ceiling is ~522 s and the parity cap is sqrt(522/1.34e-8) ~= 197k,
# rounded to 200,000. c was measured under config/ (150 m steps here vs 100 m) but it
# transfers: at these tree sizes the O(n^2) scan dominates utterly -- 23k nodes is
# ~5.5e8 hypot calls, i.e. essentially the whole 12.07 s -- and that term depends on
# tree size and agent count, not on the mesh. The step size only moves the
# non-dominant evaluate_joint_discrete term, and moves it DOWN (fewer waypoints per
# metre), so 200,000 is if anything conservative.
#
# Note run_timeout_s in the sweep configs was raised 900 -> 1200 alongside this: at
# 900 s neither method could actually spend its documented budget once refinement is
# added, which would have turned budget-exhaustion failures into timeout failures.
#
# In practice the cap rarely binds under this config -- every preset scenario now
# solves (maze 57 iters, gauntlet 46, shoreline 41, clustered 176, dual 300,
# long_sparse 1063, single 2318, two_routes 2721). It binds on the tightened
# thresholds the ladder imposes, which is exactly where the budget should matter.
clgbt_max_iterations: 200000

# Arc length of ONE propagation step, and the spacing of the waypoints handed to
# the refiner.
#
# NOT a free resolution knob. The covariance model fuses landmarks once per
# waypoint (src/covariance.jl, advance_to_arc!), so halving this doubles the
# number of landmark updates along the same geometry and quietly gives clgbt a
# better sensor model than every other planner — the measured physics changes,
# not just the path smoothness. The default is HEX_WIDTH_M, the hex
# centre-to-centre spacing, which is exactly the fusion cadence the graph
# planners get; planners/clgbt.jl warns if you change it.
#
# Left UNSET on purpose so it tracks hex_width_m automatically — pinning a
# number here would silently decouple the two the next time hex_width_m moves
# (config/mc/main.yaml already runs at 150).
# clgbt_step_m: 100.0

# How close the primary must come to the goal before the goal is pinned onto its
# path as a final waypoint. The uncertainty threshold is then certified at that
# pinned point, i.e. on the trajectory actually shipped. (The hex version tested
# a goal-ADJACENT cell centre and then let seed_control_points move that control
# point to the true goal, leaving the last stretch uncertified — the same gap
# run_constraint_sweep.jl:428-432 documents for the discrete planners.)
# Defaults to clgbt_step_m; left unset for the same reason.
# clgbt_goal_radius_m: 100.0

# Reject any branch whose primary arc exceeds this multiple of the straight-line
# start→goal distance. The hex version bounded branch depth implicitly — its
# per-agent `visited` set plus out-degree 3 strangled long wandering branches —
# and in open R² nothing does, while cost per extension is linear in depth.
clgbt_max_path_factor: 3.0

# Probability a sampled joint target aims the PRIMARY directly at the goal
# instead of a uniformly random point in the corridor. Mirrors the original's
# [Planner] goal_bias.
clgbt_goal_bias: 0.1

# Probability each SUPPORT's sampled target is snapped to the primary's own
# sampled target, instead of drawn independently. Mirrors the original's
# besties_bias with besties_bias_type=0 ("replicate one robot's coords onto
# all robots"). Defaulted well above the original's own shipped default (mostly
# 0 across their configs) because a support that samples fully independently of
# the primary rarely ends up somewhere useful for localization, and this is
# the only mechanism this port has for "helper stays near primary" — without
# it the baseline mostly fails to find a feasible tree at all.
#
# Their type-1 annulus variant ("sample in a ring around another robot") is
# still not ported, but it is no longer INEXPRESSIBLE the way it was over
# discrete graph nodes — the state space is continuous now, so it is a genuine
# option if this bias ever proves too blunt.
clgbt_besties_bias: 0.5

# Each successful RRT extension advances EVERY agent, jointly, by a number of
# steps of clgbt_step_m sampled uniformly from 1:clgbt_extend_steps -- mirrors
# the original's controlDur (a random integration-step count per propagated
# edge). All agents in one extension take the SAME number of steps AND hold a
# single constant heading throughout it (their joint control/duration is shared,
# exactly as in the original's stacked propagation), so an agent's contribution
# to one extension is a straight segment and support and primary path lengths
# never need reconciling.
# The whole extension is discarded (no tree node added) if any single step is
# infeasible for any agent, mirroring the original's `propCd == cd` check —
# a partial-duration propagation is not kept as a partial motion.
clgbt_extend_steps: 3

# RNG seed for the tree search, independent of generate_plan.jl's global seed
# (same pattern as generate_scenario's local Random.MersenneTwister — see
# src/scenario_generation.jl). This is the only baseline in this repo whose
# discrete seed is randomized rather than deterministic; fixing this pins that
# randomness so a run is reproducible.
clgbt_seed: 42

# NOTE — there is deliberately no `clgbt_max_turn` key. The per-step heading cap
# is DERIVED at load time in planners/clgbt.jl by bisecting on the repo's own
# spline sampler for the largest turn whose B-spline still satisfies
# κ ≤ 1/min_turn_radius_m (~85° at the defaults). The circular-arc relation
# Δθ = step/radius is the wrong bound — it permits 143°, which measures
# max|κ| = 0.19 against a 0.025 limit, and the barrier then burns its whole
# budget recovering feasibility instead of shortening. Change min_turn_radius_m
# or clgbt_step_m and the cap follows automatically.
