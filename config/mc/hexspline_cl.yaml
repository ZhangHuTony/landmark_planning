# Sweep tuning for hexspline_cl (and its straight_cont / discrete_only aliases).
# Snapshot of config/hexspline_cl.yaml -- see the drift note in config/mc/main.yaml.
#
# astar_iteration_limit is the ONE deliberate difference: a sweep runs hundreds
# of plans, and a tightening constraint makes each search longer, so the budget
# is cut from the interactive 1600000. That makes every recorded failure mean
# "not found within budget", never "proven infeasible" -- results.yaml's
# astar_iterations is carried into trials.csv so budget-limited failures stay
# distinguishable. Raise this if too many rows come back at the ceiling.

# Parameters used only by the hexspline_cl planner (joint discrete A* +
# continuous B-spline refinement). Merged with config/main.yaml at load time.

primary_epsilon: 0.0

# NOTE: the constraint parameters this planner is judged against
# (unc_radius_threshold, unc_feas_tol, min_turn_radius_m) live in
# config/main.yaml — they define the feasible set for EVERY algorithm, not this
# one's tuning. Only knobs that decide how this planner chases them are here.

# Relaxed discrete search
enable_relaxed_discrete: false
relaxed_discrete_delta_mode: relative
relaxed_discrete_delta_abs: 0.20
relaxed_discrete_delta_rel: 0.2
continue_astar_on_infeasible: true

# Pruning flags
prune_by_comm_radius_joint: false
prune_by_primary_uncertainty: false
prune_by_support_uncertainty: false

# A* parameters
# 150k, down from 1e6. Measured on sweep 2026-08-07_15-46-03: the most expensive
# run that ever SUCCEEDED used 37,852 expansions, while every failure ran the
# full 1e6 and cost ~200 s against ~21 s for a success. Failures therefore set
# the sweep's wall clock, and 1e6 bought nothing above ~4x the observed success
# ceiling. Re-check this if goal_dist_max is raised — the joint state space grows
# fast in D, and this number is calibrated to the 600-800 m band, not to the
# paper's long scenarios.
astar_iteration_limit: 150000
straight_cont_primary_wpts: 11
support_idle_penalty: 30.0
support_plot_offset_m: 3.0

# Continuous optimizer
cont_opt_iters: 1000
cont_opt_lr: 0.5
cont_opt_h: 1.0e-4
#   cont_recover_h — finite-difference step used ONLY while the iterate is still
#     infeasible (see `reached_feasible`), in METRES. WAS 1.0; see the full A/B in
#     config/hexspline_cl.yaml. Short version: the 1 m probe was chosen because a
#     1e-4 probe left a straight seed stuck, but that was an artifact of the
#     barrier's μ decaying during recovery — the fine probe's signal reaches the
#     objective with gain μ/δ, and the old schedule drove μ to ~1e-4 mid-recovery.
#     With μ now held while infeasible the fine probe wins nearly everywhere.
cont_recover_h: 1.0e-4
cont_adam_b1: 0.9
cont_adam_b2: 0.999
cont_adam_eps: 1.0e-8
cont_conv_tol: 1.0e-3
cont_unc_use_waypoints: true
cont_barrier_start: 20.0
cont_barrier_decay: 0.35
cont_barrier_stages: 15
cont_linesearch_shrink: 0.5
cont_min_improvement: 1.0e-6
# Removed: cont_smooth_penalty / cont_barrier_hard_penalty (the smoothing phase they
# weighted is gone, and the barrier now continues the log by its own tangent below
# the knee instead of switching to a quadratic hard penalty).

# The optimizer is ONE problem, for every seed: minimize path length under a
# tangent-extended log barrier. Under the discrete seed the seed gate
# (seed_spline_clear) certifies feasibility up front, so it never leaves the
# feasible set. Under the straight_cont ablation's ungated straight-line seed it
# may start outside — the barrier's tangent below the knee carries a restoring
# gradient of −μ/ε, which at μ=20, ε=1e-3 is ~4 orders of magnitude above the
# path-length gradient, so the SAME objective recovers first and shortens after.
# No separate restoration phase; see `reached_feasible` in optimize_continuous
# for the one gate that differs.
#   cont_restore_margin — ε, the knee of the barrier: above ε the term is
#     −μ·log(slack), below it the log's own tangent, so the objective stays finite
#     for finite-difference probes that step outside. Also the strict-interior
#     margin the seed is expected to clear (warned about, not enforced).
#     NOTE: slacks are mixed units. Obstacle/support/uncertainty slacks are metres
#     (uncertainty against a threshold of ~7), so ε=1e-3 is a negligible margin
#     there; curvature slack is 1/m bounded by MAX_CURVATURE = 1/min_turn_radius_m
#     = 0.025, so ε is 4% of that class's whole range. Curvature is where a single
#     scalar ε bites hardest — split into per-class margins if it binds.
cont_restore_margin: 1.0e-3

# Spline parameters. (min_turn_radius_m moved to config/main.yaml — it is the
# curvature CONSTRAINT, κ ≤ 1/min_turn_radius_m, not a spline discretization knob.)
spline_degree: 3
spline_samples_per_seg: 5
spline_curvature_samples_per_seg: 8
