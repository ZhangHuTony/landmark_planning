# Parameters used only by the hexspline_cl planner (joint discrete A* +
# continuous B-spline refinement). Merged with config/main.yaml at load time.

astar_mode: limit
primary_epsilon: 0.0

# Uncertainty thresholds
unc_radius_threshold: 7.0
unc_feas_tol: 1.0e-6

# Relaxed discrete search
enable_relaxed_discrete: false
relaxed_discrete_delta_mode: relative
relaxed_discrete_delta_abs: 0.20
relaxed_discrete_delta_rel: 0.2
continue_astar_on_infeasible: true

# Pruning flags
prune_by_comm_radius_joint: false
prune_by_primary_uncertainty: false
prune_by_support_uncertainty: false

# A* parameters
astar_iteration_limit: 2500000
straight_cont_primary_wpts: 11
support_idle_penalty: 30.0
support_plot_offset_m: 3.0

# Continuous optimizer
cont_opt_iters: 1000
cont_opt_lr: 0.5
cont_opt_h: 1.0e-4
cont_adam_b1: 0.9
cont_adam_b2: 0.999
cont_adam_eps: 1.0e-8
cont_conv_tol: 1.0e-3
cont_unc_use_waypoints: true
cont_barrier_start: 20.0
cont_barrier_decay: 0.35
cont_barrier_stages: 10
cont_linesearch_shrink: 0.5
cont_min_improvement: 1.0e-6
# Removed: cont_smooth_penalty / cont_barrier_hard_penalty. The smoothing phase
# they weighted is gone (Phase I minimizes squared constraint violation, and a
# uniform weight across all four classes changes neither the relative weighting
# nor Adam's direction), and Phase II's barrier now continues the log by its own
# tangent below the knee instead of switching to a quadratic hard penalty.

# Phase I (restoration). The optimizer runs two separate problems: Phase I drives
# constraint violation to zero *with margin*, Phase II then minimizes path length
# without ever leaving the feasible set.
#   cont_restore_margin — ε, the strict-interior margin Phase I must reach before
#     Phase II starts. Also the knee of Phase II's barrier: above ε the term is
#     −μ·log(slack), below it the log's own tangent, so the objective stays finite
#     for finite-difference probes that step outside.
#     NOTE: slacks are mixed units. Obstacle/support/uncertainty slacks are metres
#     (uncertainty against a threshold of ~7), so ε=1e-3 is a negligible margin
#     there; curvature slack is 1/m bounded by MAX_CURVATURE = 1/min_turn_radius_m
#     = 0.025, so ε is 4% of that class's whole range. Curvature is where a single
#     scalar ε bites hardest — split into per-class margins if it binds.
cont_restore_margin: 1.0e-3
cont_restore_iters: 1000
cont_restore_restarts: 3
#   cont_restore_h — finite-difference step for Phase I's gradient, in METRES.
#     Deliberately much larger than cont_opt_h. The terminal-uncertainty gradient
#     vanishes to first order at a straight-line configuration (moving an interior
#     control point perpendicular to a straight path changes arc length only to
#     second order), so at h=1e-4 the forward difference measures nothing but the
#     O(h) quadratic remainder and Adam's sign-based step walks uphill. Landmarks
#     sit 200+ m off the corridor: the landscape's features are metres-to-hundreds
#     of metres wide, so the probe has to be too. Measured on the dual scenario:
#     h=1e-4 and h=1e-2 both leave a straight-line seed completely stuck, h=1.0
#     restores every seed to the interior.
cont_restore_h: 1.0

# Spline parameters
spline_degree: 3
spline_samples_per_seg: 5
spline_curvature_samples_per_seg: 8
min_turn_radius_m: 40.0
