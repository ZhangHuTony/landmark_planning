# Parameters used only by the `sequential` baseline (prioritized planning:
# primary alone, then one helper at a time, then the primary once more).
# Merged with config/main.yaml at load time. Every key here is DEFAULTED in
# planners/sequential.jl, so this file is documentation and tuning, not a
# requirement -- the planner runs against a config folder that lacks it.

# Bound leg 1 is searched against, as a MULTIPLE of unc_radius_threshold.
# Leg 1 plans the primary while every helper is still parked at the start, so
# holding it to the full constraint asks one agent to achieve what the whole team
# is meant to achieve. Once the constraint tightens, no goal candidate clears the
# bound at all, the search falls back to the minimum-uncertainty route -- a long
# landmark detour -- and the helpers inherit a route that never needed them.
# With slack, leg 1 returns the SHORTEST route under a reachable bound (A* pops in
# f order, so the first goal candidate that clears it is the shortest one that
# does) and the rest is left to the helpers and the leg-4 re-plan.
#
#   1.0        hold leg 1 to the true constraint
#   2.0        covers a 100%->50% constraint ladder: twice the current threshold
#              is still at least the unconstrained reference's own uncertainty
#   very large leg 1 ignores uncertainty entirely, i.e. the shortest
#              obstacle-clear route -- the same primary `greedy` commits to
#
# Leg 4 is NOT slackened: it plans against real helpers and is the route actually
# shipped, so it is held to unc_radius_threshold itself.
sequential_leg1_slack: 2.0

# Labels kept per layer of a helper leg. Layers are first pruned by PSD dominance
# on both beliefs (sound); this cap is the backstop for when that is not enough.
# It ranks by the primary's uncertainty SO FAR, which is myopic, so a tight beam
# degrades a helper leg back toward the `greedy` baseline's depth-1 rule. Cost is
# roughly beam x 3 x (primary path steps) joint evaluations per helper.
sequential_beam: 400

# Re-plan the primary ONCE against the finished helper paths (leg 4), keeping the
# result only if it ranks better (feasible over infeasible; then shorter; among
# infeasible, lower terminal uncertainty). The helpers are never re-planned in
# response -- the algorithm stops there by construction. false = stop after the
# helper legs, which is the purer "one pass per agent" ablation.
sequential_replan_primary: true
