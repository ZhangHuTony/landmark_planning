# Body-frame slots the supports hold, in 60 deg units off the primary's heading:
#   +1 = 60 deg left, -1 = 60 deg right, +/-2 = 120 deg, 3 = directly behind.
#   0 is the primary's own cell and is not offerable.
# One slot per support (num_agents - 1 of them), in agent order.
#
# READ ONLY FOR 3+ AGENTS. With a single support the planner searches both
# lateral slots (+1 and -1) itself and keeps whichever scores better, so this
# key is ignored -- picking that one slot wrong is the planner's worst failure
# mode and it is cheap to just try both.
formation_offsets: 1,-1,2,-2,3
